<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Sprint 12 Burndown Chart Showing Anomaly</title>
  <desc id="desc">A simple burndown chart with planned and actual lines and a highlighted anomaly window mid-sprint.</desc>
  <defs>
    <linearGradient id="gridGradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#gridGradient)" />
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="310" />
    <line x1="80" y1="310" x2="600" y2="310" />
    <g stroke-dasharray="4 8">
      <line x1="80" y1="80" x2="600" y2="80" />
      <line x1="80" y1="140" x2="600" y2="140" />
      <line x1="80" y1="200" x2="600" y2="200" />
      <line x1="80" y1="260" x2="600" y2="260" />
    </g>
  </g>
  <g font-family="'Inter', system-ui, -apple-system" font-size="12" fill="#334155">
    <text x="70" y="315" text-anchor="end">Day 0</text>
    <text x="160" y="328" text-anchor="middle">2</text>
    <text x="240" y="328" text-anchor="middle">4</text>
    <text x="320" y="328" text-anchor="middle">6</text>
    <text x="400" y="328" text-anchor="middle">8</text>
    <text x="480" y="328" text-anchor="middle">10</text>
    <text x="560" y="328" text-anchor="middle">12</text>
    <text x="64" y="86" text-anchor="end">80</text>
    <text x="64" y="146" text-anchor="end">60</text>
    <text x="64" y="206" text-anchor="end">40</text>
    <text x="64" y="266" text-anchor="end">20</text>
    <text x="320" y="348" text-anchor="middle" font-weight="600">Sprint days</text>
    <text x="24" y="24" font-weight="700">Remaining work</text>
  </g>
  <rect x="280" y="120" width="90" height="180" fill="#fef9c3" stroke="#fbbf24" stroke-width="1.5" rx="6" />
  <text x="325" y="140" text-anchor="middle" font-family="'Inter', system-ui, -apple-system" font-size="12" fill="#92400e" font-weight="600">Anomaly window</text>
  <g fill="none" stroke-width="3">
    <polyline points="80,70 600,310" stroke="#38bdf8" />
    <polyline points="80,70 160,120 240,160 320,155 400,190 480,175 560,210 600,220" stroke="#ef4444" />
  </g>
  <g font-family="'Inter', system-ui, -apple-system" font-size="12" fill="#0f172a" font-weight="600">
    <rect x="420" y="48" width="180" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <line x1="432" y1="78" x2="594" y2="78" stroke="#e2e8f0" />
    <circle cx="438" cy="66" r="5" fill="#38bdf8" />
    <text x="450" y="70">Planned burndown</text>
    <circle cx="438" cy="92" r="5" fill="#ef4444" />
    <text x="450" y="96">Actual with unplanned work</text>
  </g>
</svg>
